services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "9500:9500"
    env_file:
      - .env
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9500/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "9501:9501"
    environment:
      - VITE_API_URL=http://localhost:9500
      - VITE_WS_URL=ws://localhost:9500
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

volumes:
  backend_data:
