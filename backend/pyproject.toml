[project]
name = "notionforge-backend"
version = "0.2.0"
description = "NotionForge - AI 기반 노션 템플릿 자동 생성 에이전트"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "NotionForge Contributors" }]
keywords = ["notion", "ai-agent", "template", "fastapi", "llm"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "websockets>=14.0",
    "notion-client>=2.0.0",
    "anthropic>=0.40.0",
    "google-genai>=1.68.0",
    "groq>=1.1.2",
    "python-multipart>=0.0.24",
    "github-copilot-sdk>=0.2.1",
]

[project.urls]
Homepage = "https://github.com/JaylenAI/Notion_Forge"
Repository = "https://github.com/JaylenAI/Notion_Forge"
Documentation = "https://github.com/JaylenAI/Notion_Forge/tree/main/docs"
Issues = "https://github.com/JaylenAI/Notion_Forge/issues"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "python-pptx>=1.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "app/core/config.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E402", "E501"]

[tool.ruff.format]
quote-style = "double"
