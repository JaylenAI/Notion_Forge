<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet" />
    <title>NotionForge</title>
    <style>
      /* FOUC 방지: TailwindCSS 로드 전까지 #root 완전 숨김 */
      html { background: #131313; }
      html.light-theme { background: #fdf8fd; }
      #root { opacity: 0; }
      #app-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #131313;
      }
      html.light-theme #app-loader { background: #fdf8fd; }
      #app-loader .spinner {
        width: 32px; height: 32px;
        border: 3px solid #353534; border-top-color: #adc6ff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      html.light-theme #app-loader .spinner {
        border-color: #e0e0e0; border-top-color: #005bc1;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <script>
      // 테마를 JS 번들 로드 전에 즉시 적용 — 로더 배경색 매칭
      try{if(localStorage.getItem("notionforge_theme")==="light")document.documentElement.classList.add("light-theme")}catch(e){}
    </script>
    <div id="app-loader"><div class="spinner"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
