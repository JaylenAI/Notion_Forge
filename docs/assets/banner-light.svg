<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>

  <rect x="60" y="80" width="56" height="56" rx="12" fill="url(#accent)"/>
  <text x="74" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="white">N</text>

  <text x="136" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#1a1a2e">
    NotionForge
  </text>

  <text x="62" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#64748b">
    AI Agent for Notion Template Generation
  </text>

  <rect x="62" y="200" width="90" height="32" rx="6" fill="#dbeafe"/>
  <text x="77" y="221" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2563eb">FastAPI</text>

  <rect x="164" y="200" width="84" height="32" rx="6" fill="#f3e8ff"/>
  <text x="176" y="221" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#7c3aed">React</text>

  <rect x="260" y="200" width="140" height="32" rx="6" fill="#fef3c7"/>
  <text x="278" y="221" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#d97706">Notion API</text>

  <rect x="412" y="200" width="130" height="32" rx="6" fill="#dcfce7"/>
  <text x="430" y="221" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#16a34a">AI Agents</text>

  <rect x="554" y="200" width="110" height="32" rx="6" fill="#fee2e2"/>
  <text x="567" y="221" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#dc2626">48 Skills</text>

  <!-- Architecture diagram mini -->
  <g transform="translate(780, 60)">
    <rect width="360" height="180" rx="12" fill="white" fill-opacity="0.7" stroke="#e2e8f0" stroke-width="1"/>

    <rect x="20" y="20" width="80" height="28" rx="4" fill="#dbeafe"/>
    <text x="35" y="39" font-family="monospace" font-size="10" fill="#2563eb">Input</text>

    <line x1="100" y1="34" x2="120" y2="34" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="120" y="20" width="80" height="28" rx="4" fill="#f3e8ff"/>
    <text x="128" y="39" font-family="monospace" font-size="10" fill="#7c3aed">Analyze</text>

    <line x1="200" y1="34" x2="220" y2="34" stroke="#94a3b8" stroke-width="1.5"/>

    <rect x="220" y="20" width="80" height="28" rx="4" fill="#dcfce7"/>
    <text x="240" y="39" font-family="monospace" font-size="10" fill="#16a34a">Plan</text>

    <rect x="20" y="70" width="80" height="28" rx="4" fill="#fef3c7"/>
    <text x="28" y="89" font-family="monospace" font-size="10" fill="#d97706">Generate</text>

    <line x1="100" y1="84" x2="120" y2="84" stroke="#94a3b8" stroke-width="1.5"/>

    <rect x="120" y="70" width="80" height="28" rx="4" fill="#fee2e2"/>
    <text x="135" y="89" font-family="monospace" font-size="10" fill="#dc2626">Validate</text>

    <line x1="200" y1="84" x2="220" y2="84" stroke="#94a3b8" stroke-width="1.5"/>

    <rect x="220" y="70" width="80" height="28" rx="4" fill="#dbeafe"/>
    <text x="232" y="89" font-family="monospace" font-size="10" fill="#2563eb">Execute</text>

    <rect x="20" y="120" width="280" height="40" rx="6" fill="#f1f5f9"/>
    <text x="60" y="145" font-family="monospace" font-size="11" fill="#475569">Plan → Execute → Reflect → Done</text>
  </g>
</svg>
