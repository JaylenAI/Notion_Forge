<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>

  <rect x="60" y="80" width="56" height="56" rx="12" fill="url(#accent)"/>
  <text x="74" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="white">N</text>

  <text x="136" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#f1f5f9">
    NotionForge
  </text>

  <text x="62" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8">
    AI Agent for Notion Template Generation
  </text>

  <rect x="62" y="200" width="90" height="32" rx="6" fill="#1e3a5f"/>
  <text x="77" y="221" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#60a5fa">FastAPI</text>

  <rect x="164" y="200" width="84" height="32" rx="6" fill="#2d1b4e"/>
  <text x="176" y="221" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#a78bfa">React</text>

  <rect x="260" y="200" width="140" height="32" rx="6" fill="#3b2f1a"/>
  <text x="278" y="221" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fbbf24">Notion API</text>

  <rect x="412" y="200" width="130" height="32" rx="6" fill="#14332a"/>
  <text x="430" y="221" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4ade80">AI Agents</text>

  <rect x="554" y="200" width="110" height="32" rx="6" fill="#3b1c1c"/>
  <text x="567" y="221" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f87171">48 Skills</text>

  <!-- Architecture diagram mini -->
  <g transform="translate(780, 60)">
    <rect width="360" height="180" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>

    <rect x="20" y="20" width="80" height="28" rx="4" fill="#1e3a5f"/>
    <text x="35" y="39" font-family="monospace" font-size="10" fill="#60a5fa">Input</text>

    <line x1="100" y1="34" x2="120" y2="34" stroke="#475569" stroke-width="1.5"/>

    <rect x="120" y="20" width="80" height="28" rx="4" fill="#2d1b4e"/>
    <text x="128" y="39" font-family="monospace" font-size="10" fill="#a78bfa">Analyze</text>

    <line x1="200" y1="34" x2="220" y2="34" stroke="#475569" stroke-width="1.5"/>

    <rect x="220" y="20" width="80" height="28" rx="4" fill="#14332a"/>
    <text x="240" y="39" font-family="monospace" font-size="10" fill="#4ade80">Plan</text>

    <rect x="20" y="70" width="80" height="28" rx="4" fill="#3b2f1a"/>
    <text x="28" y="89" font-family="monospace" font-size="10" fill="#fbbf24">Generate</text>

    <line x1="100" y1="84" x2="120" y2="84" stroke="#475569" stroke-width="1.5"/>

    <rect x="120" y="70" width="80" height="28" rx="4" fill="#3b1c1c"/>
    <text x="135" y="89" font-family="monospace" font-size="10" fill="#f87171">Validate</text>

    <line x1="200" y1="84" x2="220" y2="84" stroke="#475569" stroke-width="1.5"/>

    <rect x="220" y="70" width="80" height="28" rx="4" fill="#1e3a5f"/>
    <text x="232" y="89" font-family="monospace" font-size="10" fill="#60a5fa">Execute</text>

    <rect x="20" y="120" width="280" height="40" rx="6" fill="#1e293b"/>
    <text x="60" y="145" font-family="monospace" font-size="11" fill="#94a3b8">Plan → Execute → Reflect → Done</text>
  </g>
</svg>
