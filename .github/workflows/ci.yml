name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: cd backend && uv sync --frozen
      - name: Ruff check
        run: cd backend && uv run ruff check .
      - name: Ruff format check
        run: cd backend && uv run ruff format --check .

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: cd backend && uv sync --frozen

      - name: Run unit + integration tests with coverage
        run: |
          cd backend && uv run pytest tests/unit/ tests/integration/ -v \
            --tb=short \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

      - name: Coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: backend/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.80

  frontend-lint:
    name: Frontend Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci
      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit
      - name: ESLint
        run: cd frontend && npm run lint

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci
      - name: Build
        run: cd frontend && npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          push: false
          tags: notionforge-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: prod
          push: false
          tags: notionforge-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 히스토리 스캔 (과거 커밋에 유입된 시크릿 탐지)
      - uses: astral-sh/setup-uv@v4
      - run: cd backend && uv sync --frozen

      - name: Check for hardcoded secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

      - name: Bandit security analysis
        run: |
          cd backend && uv run pip install bandit -q
          uv run bandit -r app/ -ll -ii --format json -o bandit-report.json || true
          uv run bandit -r app/ -ll -ii

      - name: Check dependencies for known vulnerabilities
        run: |
          cd backend && uv run pip install pip-audit -q
          uv run pip-audit || true

      - name: Check dependency license compatibility
        run: |
          cd backend && uv run pip install pip-licenses -q
          uv run pip-licenses --format=markdown --with-urls > ../THIRD_PARTY_LICENSES.md || true
          # GPL/AGPL 계열(비호환 가능) 발견 시 경고 — MIT 프로젝트 라이선스 호환성 점검
          if uv run pip-licenses --format=plain | grep -iE "GPL|AGPL" | grep -ivE "LGPL"; then
            echo "::warning::GPL/AGPL 계열 의존성 발견 — MIT 라이선스 호환성 검토 필요"
          else
            echo "[OK] GPL/AGPL 비호환 의존성 없음"
          fi

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: backend/bandit-report.json

  api-docs:
    name: API Documentation
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: cd backend && uv sync --frozen

      - name: Generate OpenAPI schema
        run: |
          cd backend && uv run python -c "
          import json
          from app.main import app
          schema = app.openapi()
          with open('openapi.json', 'w') as f:
              json.dump(schema, f, indent=2, ensure_ascii=False)
          print(f'OpenAPI schema generated: {len(schema.get(\"paths\", {}))} endpoints')
          "

      - name: Upload API docs
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: backend/openapi.json

  release-check:
    name: Release Readiness
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, docker-build, security-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: cd backend && uv sync --frozen

      - name: Verify test count
        run: |
          cd backend && RESULT=$(uv run pytest tests/unit/ --co -q 2>/dev/null | tail -1)
          echo "Collected tests: $RESULT"

      - name: Verify no TODO/FIXME in production code
        run: |
          cd backend && grep -rn "TODO\|FIXME\|HACK\|XXX" app/ --include="*.py" || echo "No TODOs found"

      - name: Check version consistency
        run: |
          PYPROJECT=$(grep -m1 '^version = ' backend/pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          APPVER=$(grep -m1 '^__version__' backend/app/__init__.py | sed -E 's/.*"(.*)"/\1/')
          PKG=$(grep -m1 '"version"' frontend/package.json | sed -E 's/.*"version": "(.*)",/\1/')
          echo "pyproject=$PYPROJECT app=$APPVER package.json=$PKG"
          if [ "$PYPROJECT" != "$APPVER" ] || [ "$PYPROJECT" != "$PKG" ]; then
            echo "::error::버전 불일치 — pyproject=$PYPROJECT app=$APPVER package.json=$PKG"
            exit 1
          fi
          echo "[OK] 버전 일치: $PYPROJECT"
